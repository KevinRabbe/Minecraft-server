name: Build

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: minecraft
          POSTGRES_USER: minecraft
          POSTGRES_PASSWORD: minecraft-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minecraft -d minecraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/minecraft
      TEST_DATABASE_USER: minecraft
      TEST_DATABASE_PASSWORD: minecraft-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Validate PowerShell operations scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path infra/local -Filter *.ps1 -File | Sort-Object Name | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $($_.FullName):"
              $parseErrors | ForEach-Object {
                Write-Host "  line $($_.Extent.StartLineNumber), column $($_.Extent.StartColumnNumber): $($_.Message)"
              }
            }
          }
          if ($failed) {
            exit 1
          }

      - name: Build
        id: gradle-build
        shell: bash
        run: |
          set +e
          gradle clean build --no-daemon > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Gradle build failed. Last 140 log lines:"
            tail -n 140 build.log
            exit "$status"
          fi
          tail -n 40 build.log

      - name: Upload Gradle failure diagnostics
        if: steps.gradle-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-diagnostics
          path: |
            build.log
            common/build/test-results/test/
            common/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7

      - name: Report Gradle failure on PR
        if: steps.gradle-build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- gradle-build-failure -->'
            echo '### Gradle build failure'
            echo
            echo '```text'
            tail -n 100 build.log
            echo '```'
          } > gradle-failure.md
          gh pr comment "$PR_NUMBER" --body-file gradle-failure.md
