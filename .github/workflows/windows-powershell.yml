name: Windows PowerShell Compatibility

on:
  push:
  pull_request:

jobs:
  windows-powershell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate operations scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path infra/local -Filter *.ps1 -File | Sort-Object Name | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              Write-Host "Windows PowerShell parse errors in $($_.FullName):"
              $parseErrors | ForEach-Object {
                Write-Host "  line $($_.Extent.StartLineNumber), column $($_.Extent.StartColumnNumber): $($_.Message)"
              }
            }
          }
          if ($failed) {
            exit 1
          }

          . (Resolve-Path infra/local/settings.ps1)
          $starterWoodsServers = @($LocalNetwork.Servers | Where-Object { $_.Zone -eq 'starter-woods' })
          if ($starterWoodsServers.Count -ne 1) {
            throw 'Local topology must contain exactly one starter-woods rehearsal backend.'
          }
          $resourceCatalog = Get-Content -Raw common/src/main/resources/content/resource-sources.json | ConvertFrom-Json
          $starterWoodsTemplates = @(
            $resourceCatalog.sources |
              Where-Object { $_.zone_id -eq 'starter-woods' } |
              Select-Object -ExpandProperty template_version -Unique
          )
          if ($starterWoodsTemplates.Count -ne 1) {
            throw 'Authored starter-woods resources must resolve to exactly one template version.'
          }
          if ([string]$starterWoodsServers[0].ZoneTemplate -ne [string]$starterWoodsTemplates[0]) {
            throw "Local starter-woods template '$($starterWoodsServers[0].ZoneTemplate)' does not match authored resource template '$($starterWoodsTemplates[0])'."
          }

          $initializer = Get-Content -Raw infra/local/begin-restore-rehearsal.ps1
          if ($initializer.Contains('System.Collections.Generic.List[object]')) {
            throw 'Restore rehearsal evidence must use native PowerShell arrays.'
          }

          $ports = @(
            [ordered]@{ process = 'velocity'; port = 25565; reachable = $false }
          )
          $ports += [ordered]@{ process = 'paper-01'; port = 25566; reachable = $false }

          $environment = [ordered]@{
            schema_version = 1
            runtime = [ordered]@{ observed_ports = $ports }
          }
          $roundTrip = $environment | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          if (@($roundTrip.runtime.observed_ports).Count -ne 2) {
            throw 'Windows PowerShell 5.1 evidence serialization lost port entries.'
          }

          $setup = Get-Content -Raw infra/local/setup.ps1
          if (-not $setup.Contains('System.Text.UTF8Encoding($false)')) {
            throw 'Local setup must explicitly write Velocity text as UTF-8 without BOM.'
          }
          if (-not $setup.Contains('try = ["$initialBackendId"]')) {
            throw 'Velocity config must use the configured initial backend.'
          }
          if ($setup.Contains('try = ["city-01"]')) {
            throw 'Velocity config still contains the obsolete city-01 literal.'
          }

          $start = Get-Content -Raw infra/local/start.ps1
          if ($start.Contains('velocityText') -or $start.Contains('Set-Content -Encoding UTF8 $velocityConfig')) {
            throw 'start.ps1 must not mutate velocity.toml.'
          }

          $utf8Path = Join-Path $env:RUNNER_TEMP 'velocity-no-bom.toml'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($utf8Path, '# generated', $utf8)
          $bytes = [System.IO.File]::ReadAllBytes($utf8Path)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw 'UTF-8 no-BOM writer emitted a BOM.'
          }
